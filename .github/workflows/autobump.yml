name: Auto-bump casks and formulas

on:
  schedule:
    - cron: "0 8 * * *"  # daily at 8am UTC
  workflow_dispatch:  # manual trigger

jobs:
  bump:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Tap self
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/egigoka"
          ln -sfn "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/egigoka/homebrew-cask-notinbrew"

      - name: Check and bump casks and formulas
        run: |
          set -e

          updated=false

          update_version() {
            VERSION_SOURCE="$4" OLD_VERSION="$2" NEW_VERSION="$3" ruby -e '
              path = ARGV.fetch(0)
              source = ENV.fetch("VERSION_SOURCE")
              old_version = ENV.fetch("OLD_VERSION")
              new_version = ENV.fetch("NEW_VERSION")
              changed = false
              lines = File.readlines(path).map do |line|
                matches = source == "explicit" ? line.match?(/^\s*version "/) : line.match?(/^\s*url "/)
                next line unless matches && line.include?(old_version)

                changed = true
                line.sub(old_version, new_version)
              end
              abort "Could not update #{source} version in #{path}" unless changed

              File.write(path, lines.join)
            ' "$1"
          }

          # Process both casks and formulas
          for cask_file in Casks/*.rb Formula/*.rb; do
            [ -f "$cask_file" ] || continue
            cask_name=$(basename "$cask_file" .rb)
            dir_name=$(dirname "$cask_file")
            echo "=== Checking $cask_name ($dir_name) ==="

            # Determine if this is a cask or formula
            if [ "$dir_name" = "Casks" ]; then
              livecheck_flag="--cask"
            else
              livecheck_flag="--formula"
            fi

            # Prefer an explicit version, but formulas can derive it from their URL
            current_version=$(grep -m1 'version "' "$cask_file" | sed 's/.*version "//;s/".*//' || true)
            version_source="explicit"

            # Run livecheck
            livecheck_output=$(brew livecheck $livecheck_flag --json "$cask_name" 2>/dev/null || echo "[]")
            latest_version=$(echo "$livecheck_output" | ruby -rjson -e '
              data = JSON.parse(STDIN.read)
              if data.is_a?(Array) && !data.empty? && data[0]["version"] && data[0]["version"]["latest"]
                puts data[0]["version"]["latest"]
              end
            ' 2>/dev/null || echo "")

            if [ -z "$current_version" ]; then
              version_source="url"
              current_version=$(echo "$livecheck_output" | ruby -rjson -e '
                data = JSON.parse(STDIN.read)
                if data.is_a?(Array) && !data.empty? && data[0]["version"] && data[0]["version"]["current"]
                  puts data[0]["version"]["current"]
                end
              ' 2>/dev/null || echo "")
            fi

            if [ -z "$current_version" ] || [ -z "$latest_version" ]; then
              echo "Could not determine current or latest version, skipping"
              continue
            fi

            echo "Current: $current_version"
            echo "Latest: $latest_version"

            if [ "$current_version" = "$latest_version" ]; then
              echo "Up to date"
              continue
            fi

            echo "Updating $cask_name: $current_version -> $latest_version"

            # UniFi OS Server download URLs contain release-specific UUIDs.
            if [ "$cask_name" = "unifi-os-server" ]; then
              # shellcheck disable=SC2016
              if ! release_json=$(curl -fsSL --request POST \
                --header "Content-Type: application/json" \
                --data '{"query":"query Releases($groupId: ID!, $limit: Int!) { releases(groupId: $groupId, limit: $limit) { items { version stage status links { url } } } }","variables":{"groupId":"76650b06-fc47-4892-9c12-25c64c39f842","limit":20}}' \
                "https://community.svc.ui.com/"); then
                echo "Could not fetch UniFi OS Server release metadata, skipping"
                continue
              fi

              if ! release_urls=$(LATEST_VERSION="$latest_version" ruby -rjson -e '
                data = JSON.parse(STDIN.read)
                release = data.dig("data", "releases", "items")&.find do |item|
                  item["version"] == ENV.fetch("LATEST_VERSION") &&
                    item["stage"] == "GA" && item["status"] == "PUBLISHED"
                end
                abort "Release metadata not found" unless release

                links = release.fetch("links")
                urls = links.map { |link| link["url"] }.compact
                arm_url = urls.find { |url| url.include?("-macOS-dmg-arm64-") }
                intel_url = urls.find { |url| url.include?("-macOS-dmg-amd64-") }
                abort "macOS download URLs not found" unless arm_url && intel_url

                puts [arm_url, intel_url].join("\t")
              ' <<< "$release_json"); then
                echo "Could not parse UniFi OS Server release metadata, skipping"
                continue
              fi
              IFS=$'\t' read -r arm_url intel_url <<< "$release_urls"

              tmpfile=$(mktemp)
              echo "Downloading ARM: $arm_url"
              if ! curl -fsSL --output "$tmpfile" "$arm_url"; then
                echo "ARM download failed, skipping"
                rm -f "$tmpfile"
                continue
              fi
              arm_sha=$(shasum -a 256 "$tmpfile" | awk '{print $1}')

              echo "Downloading Intel: $intel_url"
              if ! curl -fsSL --output "$tmpfile" "$intel_url"; then
                echo "Intel download failed, skipping"
                rm -f "$tmpfile"
                continue
              fi
              intel_sha=$(shasum -a 256 "$tmpfile" | awk '{print $1}')
              rm -f "$tmpfile"

              NEW_VERSION="$latest_version" ARM_URL="$arm_url" INTEL_URL="$intel_url" \
                ARM_SHA="$arm_sha" INTEL_SHA="$intel_sha" ruby -e '
                path = ARGV.fetch(0)
                replacements = {
                  version: false,
                  arm_url: false,
                  arm_sha: false,
                  intel_url: false,
                  intel_sha: false,
                }
                architecture = nil
                lines = File.readlines(path).map do |line|
                  if line.match?(/^\s*version "/)
                    replacements[:version] = true
                    line.sub(/version "[^"]+"/, %(version "#{ENV.fetch("NEW_VERSION")}"))
                  elsif line.match?(/on_arm do/)
                    architecture = :arm
                    line
                  elsif line.match?(/on_intel do/)
                    architecture = :intel
                    line
                  elsif architecture && line.match?(/^\s+end/)
                    architecture = nil
                    line
                  elsif architecture && line.match?(/^\s+url "/)
                    replacements[:"#{architecture}_url"] = true
                    url = ENV.fetch("#{architecture.upcase}_URL").sub(ENV.fetch("NEW_VERSION"), "\#{version}")
                    line.sub(/url "[^"]+"/, %(url "#{url}"))
                  elsif architecture && line.match?(/^\s+sha256 "/)
                    replacements[:"#{architecture}_sha"] = true
                    line.sub(/sha256 "[a-f0-9]+"/, %(sha256 "#{ENV.fetch("#{architecture.upcase}_SHA")}"))
                  else
                    line
                  end
                end
                missing = replacements.reject { |_key, replaced| replaced }.keys
                abort "Missing replacements: #{missing.join(", ")}" unless missing.empty?

                File.write(path, lines.join)
              ' "$cask_file"

              updated=true
              echo "Updated $cask_name to $latest_version"
              continue
            fi

            update_version "$cask_file" "$current_version" "$latest_version" "$version_source"

            # Build new URL(s) and compute sha256
            # Extract URL pattern from cask file
            urls=$(grep -E '^\s+url "' "$cask_file" | sed 's/.*url "//;s/".*//')

            # Check if sha256 is :no_check
            if grep -q 'sha256 :no_check' "$cask_file"; then
              echo "sha256 is :no_check, skipping hash update"
            else
              # Handle arch-specific sha256 (on_arm/on_intel blocks)
              if grep -q 'on_arm' "$cask_file"; then
                # Resolve URLs using Ruby to handle all interpolation patterns
                # shellcheck disable=SC2016
                read -r arm_url intel_url <<< "$(ruby -e '
                  version = ARGV[0]
                  csv = version.split(",")
                  lines = File.readlines(ARGV[1])
                  in_arm = false; in_intel = false
                  arm_url = ""; intel_url = ""
                  lines.each do |line|
                    in_arm = true if line =~ /on_arm do/
                    in_intel = true if line =~ /on_intel do/
                    if line =~ /url "([^"]+)"/
                      raw = $1
                      resolved = raw
                        .gsub("\#{version}", version)
                        .gsub("\#{version.csv.first}", csv[0].to_s)
                        .gsub("\#{version.csv.second}", csv[1].to_s)
                        .gsub("\#{version.csv.third}", csv[2].to_s)
                      if in_arm && arm_url.empty?
                        arm_url = resolved
                      elsif in_intel && intel_url.empty?
                        intel_url = resolved
                      end
                    end
                    in_arm = false if in_arm && line =~ /^\s+end/
                    in_intel = false if in_intel && line =~ /^\s+end/
                  end
                  puts "#{arm_url} #{intel_url}"
                ' "$latest_version" "$cask_file")"

                echo "Downloading ARM: $arm_url"
                arm_sha=$(curl -fsSL "$arm_url" | shasum -a 256 | awk '{print $1}')
                if [ -n "$arm_sha" ] && [ "$arm_sha" != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
                  ruby -i -e '
                    lines = File.readlines(ARGV[0])
                    in_arm = false
                    lines.each_with_index do |line, i|
                      if line =~ /on_arm do/
                        in_arm = true
                      elsif in_arm && line =~ /sha256 "/
                        lines[i] = line.sub(/"[a-f0-9]+"/, "\"'"$arm_sha"'\"")
                        in_arm = false
                      end
                    end
                    File.write(ARGV[0], lines.join)
                  ' "$cask_file"
                fi

                echo "Downloading Intel: $intel_url"
                intel_sha=$(curl -fsSL "$intel_url" | shasum -a 256 | awk '{print $1}')
                if [ -n "$intel_sha" ] && [ "$intel_sha" != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
                  ruby -i -e '
                    lines = File.readlines(ARGV[0])
                    in_intel = false
                    lines.each_with_index do |line, i|
                      if line =~ /on_intel do/
                        in_intel = true
                      elsif in_intel && line =~ /sha256 "/
                        lines[i] = line.sub(/"[a-f0-9]+"/, "\"'"$intel_sha"'\"")
                        in_intel = false
                      end
                    end
                    File.write(ARGV[0], lines.join)
                  ' "$cask_file"
                fi
              else
                # Single URL - resolve Ruby interpolation
                IFS=',' read -r -a csv_parts <<< "$latest_version"
                resolved_url=$(echo "$urls" | head -1 | \
                  sed "s/#{version.csv.first}/${csv_parts[0]:-}/g" | \
                  sed "s/#{version.csv.second}/${csv_parts[1]:-}/g" | \
                  sed "s/#{version}/$latest_version/g" | \
                  sed "s/#{sha256}//g")

                echo "Downloading: $resolved_url"
                tmpfile=$(mktemp)
                if curl -fsSL -o "$tmpfile" "$resolved_url" 2>/dev/null; then
                  new_sha=$(shasum -a 256 "$tmpfile" | awk '{print $1}')
                  rm -f "$tmpfile"

                  if [ -n "$new_sha" ]; then
                    # Get old sha256
                    old_sha=$(grep -m1 'sha256 "' "$cask_file" | sed 's/.*sha256 "//;s/".*//')
                    sed -i '' "s/sha256 \"$old_sha\"/sha256 \"$new_sha\"/" "$cask_file"

                    # For checkra1n: URL contains the sha256 hash
                    if echo "$urls" | grep -q '#{sha256}'; then
                      echo "URL contains sha256 reference, updating URL hash too"
                    fi
                  fi
                else
                  echo "Download failed, reverting version"
                  update_version "$cask_file" "$latest_version" "$current_version" "$version_source"
                  rm -f "$tmpfile"
                  continue
                fi
              fi
            fi

            updated=true
            echo "Updated $cask_name to $latest_version"
          done

          if [ "$updated" = true ]; then
            echo "UPDATED=true" >> "$GITHUB_ENV"
          fi

      - name: Commit and push
        if: env.UPDATED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-bump versions"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
